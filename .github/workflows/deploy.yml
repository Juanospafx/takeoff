name: Deploy to FTP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ftp-deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deployment artifact
        run: |
          set -e
          ARTIFACT_DIR="deploy_artifact"
          mkdir -p "$ARTIFACT_DIR"

          # Copy everything except excluded items into artifact directory
          # Using rsync to reliably exclude non-production and development assets
          rsync -av --progress ./ "$ARTIFACT_DIR/" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'tests' \
            --exclude 'docs' \
            --exclude 'harness' \
            --exclude 'db' \
            --exclude '*.sql' \
            --exclude 'graphify-out' \
            --exclude '.swarm' \
            --exclude '.claude-flow' \
            --exclude 'ruvector.db' \
            --exclude 'uploads' \
            --exclude 'logs' \
            --exclude '*.log' \
            --exclude 'tmp' \
            --exclude 'temp' \
            --exclude 'cache' \
            --exclude 'coverage' \
            --exclude "$ARTIFACT_DIR"

          # Verify critical runtime paths are present in artifact
          test -d "$ARTIFACT_DIR/api"
          test -d "$ARTIFACT_DIR/core"
          test -f "$ARTIFACT_DIR/bin/dispatch-won-project-outbox.php"

          echo "Deployment artifact generated successfully."

      # Security Note:
      # Port 21 (plain FTP) is retained due to lack of FTPS evidence from the hosting provider.
      # Plain FTP transmits credentials and code unencrypted over the network.
      # Migration to FTPS (port 990 / 21 with explicit TLS) or SFTP is recommended as soon as
      # provider configuration is confirmed. Do not attempt network connection checks during CI/build.
      - name: Deploy to FTP server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./deploy_artifact/
          server-dir: ./
          dangerous-clean-slate: false
