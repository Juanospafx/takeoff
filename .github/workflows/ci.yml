name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3.36"
          tools: composer:v2
          extensions: ctype, dom, fileinfo, filter, gd, iconv, libxml, mbstring, simplexml, xml, xmlreader, xmlwriter, zip, zlib

      - name: Composer validate
        run: composer validate --strict

      - name: Install dependencies from lock
        run: composer install --prefer-dist --no-interaction

      - name: Excel and template regression tests
        run: |
          php tests/excel_runtime_smoke.test.php
          node tests/excel_template_regression_contract.test.js
          node tests/project_creation_contract.test.js

      - name: PHP syntax check
        run: |
          set -e
          files=$(find . -name "*.php" -not -path "./vendor/*")
          if [ -z "$files" ]; then
            echo "No PHP files found."
            exit 0
          fi
          for f in $files; do php -l "$f" > /dev/null; done
          echo "PHP lint OK"

      - name: Execute Takeoff SSO test suites
        run: |
          set -e
          php tests/sso_client_contract.test.php
          php tests/sso_composer_pipeline_contract.test.php
