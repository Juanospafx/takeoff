name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3.36"
          tools: composer:v2
          extensions: ctype, dom, fileinfo, filter, gd, iconv, libxml, mbstring, simplexml, xml, xmlreader, xmlwriter, zip, zlib

      - name: Composer validate
        run: composer validate --strict

      - name: Install dependencies from lock
        run: composer install --prefer-dist --no-interaction

      - name: Excel and template regression tests
        run: |
          php tests/excel_runtime_smoke.test.php
          node tests/excel_template_regression_contract.test.js
          node tests/project_creation_contract.test.js
          node tests/asset_cache_keys.test.js
          node tests/portal_styles_extraction.test.js
          node tests/cost_catalog_incremental_render.test.js
          node tests/cost_catalog_item_inspector_extraction.test.js
          node tests/estimating_incremental_render.test.js
          node tests/estimating_modals_extraction.test.js
          node tests/project_overview_dialogs.test.js
          node tests/project_overview_notes_tasks.test.js
          node tests/editor_runtime_extraction.test.js
          node --check assets/editor/theme_bridge.js
          node --check assets/editor/authorization.js
          node --check assets/editor/runtime.js
          node --check assets/project_overview_dialogs.js
          node --check assets/project_overview_notes_tasks.js
          node --check assets/project_estimating.js
          node --check assets/project_estimating_modals.js
          node --check assets/cost_catalog.js
          node --check assets/cost_catalog_item_inspector.js
          node --check assets/takeoff_layer_modal.js
          node --check assets/takeoff_catalog_browser.js
          node --check assets/takeoff_viewer_controller.js
          node --check assets/takeoff_scale_controller.js
          node tests/takeoff_catalog_browser_controller.test.js
          node tests/takeoff_layer_modal_controller.test.js
          node tests/takeoff_viewer_scale_controller.test.js
          node tests/takeoff_layer_title_first_commit.test.js
          node tests/takeoff_modal_source_fidelity.test.js
          node tests/takeoff_editable_properties.test.js
          node tests/takeoff_linear_scale_requirement.test.js

      - name: PHP syntax check
        run: |
          set -e
          files=$(find . -name "*.php" -not -path "./vendor/*")
          if [ -z "$files" ]; then
            echo "No PHP files found."
            exit 0
          fi
          for f in $files; do php -l "$f" > /dev/null; done
          echo "PHP lint OK"

      - name: Execute Takeoff SSO test suites
        run: |
          set -e
          php tests/sso_client_contract.test.php
          php tests/sso_composer_pipeline_contract.test.php
          php tests/sso_rbac_editor_ui.test.php
          php tests/sso_rbac_project_dashboard_ui.test.php
